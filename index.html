<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des bornes de recharge</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([46.2276, 2.2137], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        fetch('bornes_recharge_mensuel.json')
            .then(response => response.json())
            .then(data => {
                var timelineControl = L.control({position: 'bottomleft'});
                var currentLayer;

                timelineControl.onAdd = function(map) {
                    var div = L.DomUtil.create('div', 'timeline-control');
                    var select = L.DomUtil.create('select', 'timeline-select', div);
                    Object.keys(data).sort().forEach(month => {
                        var option = L.DomUtil.create('option', '', select);
                        option.value = month;
                        option.innerHTML = month;
                    });
                    L.DomEvent.on(select, 'change', function() {
                        updateMap(this.value);
                    });
                    return div;
                };

                timelineControl.addTo(map);

                function updateMap(selectedMonth) {
                    if (currentLayer) {
                        map.removeLayer(currentLayer);
                    }
                    currentLayer = L.geoJSON({
                        type: "FeatureCollection",
                        features: data[selectedMonth].map(point => ({
                            type: "Feature",
                            geometry: {
                                type: "Point",
                                coordinates: [point.longitude, point.latitude]
                            },
                            properties: point
                        }))
                    }, {
                        pointToLayer: function(feature, latlng) {
                            return L.circleMarker(latlng, {
                                radius: 8,
                                fillColor: "#ff7800",
                                color: "#000",
                                weight: 1,
                                opacity: 1,
                                fillOpacity: 0.8
                            });
                        },
                        onEachFeature: function(feature, layer) {
                            layer.bindPopup(`
                                <b>Code INSEE:</b> ${feature.properties.code_insee}<br>
                                <b>Nombre de PDC:</b> ${feature.properties.nbre_pdc}<br>
                                <b>Puissance nominale:</b> ${feature.properties.puissance_nominale} kW
                            `);
                        }
                    }).addTo(map);
                }

                updateMap(Object.keys(data).sort()[0]);
            });
    </script>
</body>
</html>
