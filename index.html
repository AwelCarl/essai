<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des bornes de recharge</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; }
        #controls { margin-top: 10px; }
        .timeline-control { width: 100%; padding: 10px; background: white; }
        .timeline-input { width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <button id="play">Lecture</button>
        <button id="pause">Pause</button>
        <label for="speed">Vitesse:</label>
        <input type="range" id="speed" min="100" max="2000" value="1000" step="100">
        <span id="current-date"></span>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([46.2276, 2.2137], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var markers = L.layerGroup().addTo(map);
        var dates = [];
        var currentDateIndex = 0;
        var playInterval;
        var speed = 1000;

        fetch('bornes_recharge_mensuel.json')
            .then(response => response.json())
            .then(data => {
                dates = Object.keys(data).sort().filter(date => date >= "2014-01");
                
                var timeline = L.control({position: 'bottomleft'});
                timeline.onAdd = function(map) {
                    var div = L.DomUtil.create('div', 'timeline-control');
                    var input = L.DomUtil.create('input', 'timeline-input', div);
                    input.type = 'range';
                    input.min = 0;
                    input.max = dates.length - 1;
                    input.value = 0;
                    
                    input.addEventListener('input', function() {
                        currentDateIndex = parseInt(this.value);
                        updateMap(true);
                    });
                    
                    return div;
                };
                timeline.addTo(map);

                function updateMap(skipInterval) {
                    if (currentDateIndex >= dates.length) {
                        clearInterval(playInterval);
                        return;
                    }

                    var currentDate = dates[currentDateIndex];
                    document.getElementById('current-date').textContent = currentDate;

                    // Mise à jour de la timeline
                    document.querySelector('.timeline-input').value = currentDateIndex;

                    data[currentDate].forEach(point => {
                        L.circleMarker([point.latitude, point.longitude], {
                            radius: 5,
                            fillColor: "#ff7800",
                            color: "#000",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).bindPopup(`
                            <b>Code INSEE:</b> ${point.code_insee}<br>
                            <b>Nombre de PDC:</b> ${point.nbre_pdc}<br>
                            <b>Puissance nominale:</b> ${point.puissance_nominale} kW
                        `).addTo(markers);
                    });

                    if (!skipInterval) {
                        currentDateIndex++;
                    }
                }

                document.getElementById('play').addEventListener('click', () => {
                    clearInterval(playInterval);
                    playInterval = setInterval(() => updateMap(false), speed);
                });

                document.getElementById('pause').addEventListener('click', () => {
                    clearInterval(playInterval);
                });

                document.getElementById('speed').addEventListener('input', function() {
                    speed = 2100 - this.value; // Inverse la valeur pour que le curseur à droite soit plus rapide
                    if (playInterval) {
                        clearInterval(playInterval);
                        playInterval = setInterval(() => updateMap(false), speed);
                    }
                });

                updateMap(true); // Affiche la première date (2014-01)
            });
    </script>
</body>
</html>
