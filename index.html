<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte des bornes de recharge</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; }
        #controls { margin-top: 10px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="controls">
        <button id="play">Lecture</button>
        <button id="pause">Pause</button>
        <span id="current-date"></span>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([46.2276, 2.2137], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        var markers = L.layerGroup().addTo(map);
        var dates = [];
        var currentDateIndex = 0;
        var playInterval;

        fetch('bornes_recharge_mensuel.json')
            .then(response => response.json())
            .then(data => {
                dates = Object.keys(data).sort().filter(date => date >= "2014-01");
                
                function updateMap() {
                    if (currentDateIndex >= dates.length) {
                        clearInterval(playInterval);
                        return;
                    }

                    var currentDate = dates[currentDateIndex];
                    document.getElementById('current-date').textContent = currentDate;

                    data[currentDate].forEach(point => {
                        L.circleMarker([point.latitude, point.longitude], {
                            radius: 5,
                            fillColor: "#ff7800",
                            color: "#000",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        }).bindPopup(`
                            <b>Code INSEE:</b> ${point.code_insee}<br>
                            <b>Nombre de PDC:</b> ${point.nbre_pdc}<br>
                            <b>Puissance nominale:</b> ${point.puissance_nominale} kW
                        `).addTo(markers);
                    });

                    currentDateIndex++;
                }

                document.getElementById('play').addEventListener('click', () => {
                    clearInterval(playInterval);
                    playInterval = setInterval(updateMap, 1000); // Change de mois toutes les secondes
                });

                document.getElementById('pause').addEventListener('click', () => {
                    clearInterval(playInterval);
                });

                updateMap(); // Affiche la première date (2014-01)
            });
    </script>
</body>
</html>
